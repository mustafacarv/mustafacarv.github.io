<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body{
            background-color:#f5f7fa;
        }

        .navbar{
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        .dashboard-card{
            transition:.3s;
            cursor:pointer;
        }

        .dashboard-card:hover{
            transform:translateY(-5px);
            box-shadow:0 10px 20px rgba(0,0,0,.15);
        }

        .stat-card{
            border:none;
            border-radius:15px;
        }

        .icon{
            font-size:3rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                🍔 Restaurante do Hugo
            </a>
        </div>
    </nav>
    <div class="container mt-4">
        <h2 class="mb-4">Menu Principal</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card bg-primary text-white">
                    <div class="card-body">
                        <h6>Pedidos Hoje</h6>
                        <h2>14</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-success text-white">
                    <div class="card-body">
                        <h6>Comandas Abertas</h6>
                        <h2>5</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-danger text-white">
                    <div class="card-body">
                        <h6>Itens em Falta</h6>
                        <h2>1</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card dashboard-card h-100">
                    <div class="card-body text-center">
                        <div class="icon">🧾</div>
                        <h5>Comandas</h5>
                        <p>Abrir e gerenciar pedidos.</p>
                        <a href="comandas.html" class="btn btn-primary">Acessar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card dashboard-card h-100">
                    <div class="card-body text-center">
                        <div class="icon">🍔</div>
                        <h5>Cardápio</h5>
                        <p>Cadastro de pratos e bebidas.</p>
                        <a href="cardapio.html" class="btn btn-success">Acessar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card dashboard-card h-100">
                    <div class="card-body text-center">
                        <div class="icon">📦</div>
                        <h5>Estoque</h5>
                        <p>Controle de produtos.</p>
                        <a href="estoque.html" class="btn btn-warning">Acessar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card dashboard-card h-100">
                    <div class="card-body text-center">
                        <div class="icon">📊</div>
                        <h5>Relatórios</h5>
                        <p>Vendas e faturamento.</p>
                        <button type="button" class="btn btn-outline-secondary" disabled>Desativado</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
